name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator iverilog yosys curl unzip
          curl --fail --location --retry 3 -o /tmp/sv2v.zip \
            https://github.com/zachjs/sv2v/releases/download/v0.0.13/sv2v-Linux.zip
          echo '552799a1d76cd177b9b4cc63a3e77823a3d2a6eb4ec006569288abeff28e1ff8  /tmp/sv2v.zip' | sha256sum --check
          unzip -qo /tmp/sv2v.zip -d /tmp
          sudo install /tmp/sv2v-Linux/sv2v /usr/local/bin/sv2v
          verilator --version
          sv2v --version
          yosys -V

      - name: Lint (verilator -Wall)
        run: |
          verilator --lint-only -sv -Wall rtl/oh1_pkg.sv rtl/oh1_decode.sv rtl/oh1_core.sv --top-module oh1_core
          verilator --lint-only -sv -Wall rtl/oh1_axi_lite.sv --top-module oh1_axi_lite

      - name: Smoke test (12 checks)
        run: |
          verilator --binary --timing -j 4 -Wno-fatal -Wno-TIMESCALEMOD \
            rtl/oh1_pkg.sv rtl/oh1_decode.sv rtl/oh1_core.sv tb/tb_smoke.sv \
            --top-module tb_smoke -Mdir obj_smoke -o Vtb_smoke
          ./obj_smoke/Vtb_smoke

      - name: SIMD engine test (14 per-lane checks)
        run: |
          verilator --binary --timing -j 4 -Wno-fatal -Wno-TIMESCALEMOD \
            rtl/oh1_pkg.sv rtl/oh1_decode.sv rtl/oh1_core.sv tb/tb_simd.sv \
            --top-module tb_simd -Mdir obj_simd -o Vtb_simd
          ./obj_simd/Vtb_simd

      - name: CRV random vs golden ISS (3 seeds × 100 programs)
        run: |
          verilator --binary --timing -j 4 -Wno-fatal -Wno-TIMESCALEMOD \
            rtl/oh1_pkg.sv rtl/oh1_decode.sv rtl/oh1_core.sv tb/tb_rand.sv \
            --top-module tb_rand -Mdir obj_rand -o Vtb_rand
          for s in 1 7 42; do ./obj_rand/Vtb_rand +seed=$s +n_prog=100; done

      - name: AXI4-Lite protocol (AW/W ordering, backpressure, WSTRB, errors, IRQ W1C)
        run: |
          verilator --binary --timing -j 4 -Wno-fatal -Wno-TIMESCALEMOD \
            rtl/oh1_axi_lite.sv tb/tb_axi_smoke.sv \
            --top-module tb_axi_smoke -Mdir obj_axi -o Vtb_axi
          ./obj_axi/Vtb_axi

      - name: ISA extensions (MUL, vdot4.i8, JAL/JALR)
        run: |
          verilator --binary --timing -j 4 -Wno-fatal -Wno-TIMESCALEMOD \
            rtl/oh1_pkg.sv rtl/oh1_decode.sv rtl/oh1_core.sv tb/tb_isa_ext.sv \
            --top-module tb_isa_ext -Mdir obj_isa -o Vtb_isa
          ./obj_isa/Vtb_isa

      - name: Divergence stack overflow + relaunch
        run: |
          verilator --binary --timing -j 4 -Wno-fatal -Wno-TIMESCALEMOD \
            rtl/oh1_pkg.sv rtl/oh1_decode.sv rtl/oh1_core.sv tb/tb_stk_ovf.sv \
            --top-module tb_stk_ovf -Mdir obj_stk -o Vtb_stk
          ./obj_stk/Vtb_stk

      - name: AXI4-Lite integration (load → start → STATUS → relaunch → divergent store → IRQ)
        run: |
          verilator --binary --timing -j 4 -Wno-fatal -Wno-TIMESCALEMOD \
            rtl/oh1_pkg.sv rtl/oh1_decode.sv rtl/oh1_core.sv rtl/oh1_axi_lite.sv \
            tb/tb_axi_integration.sv \
            --top-module tb_axi_integration -Mdir obj_axiint -o Vtb_axi_int
          ./obj_axiint/Vtb_axi_int

      - name: Synchronous-read memory mode (SYNC_MEM=1, BRAM timing)
        run: |
          C="rtl/oh1_pkg.sv rtl/oh1_decode.sv rtl/oh1_core.sv"
          for t in tb_smoke tb_simd tb_isa_ext tb_stk_ovf; do
            verilator --binary --timing -j 4 -Wno-fatal -Wno-TIMESCALEMOD -GSYNC_MEM=1 \
              $C tb/$t.sv --top-module $t -Mdir obj_sync_$t -o V
            ./obj_sync_$t/V
          done
          verilator --binary --timing -j 4 -Wno-fatal -Wno-TIMESCALEMOD -GSYNC_MEM=1 \
            $C rtl/oh1_axi_lite.sv tb/tb_axi_integration.sv --top-module tb_axi_integration -Mdir obj_sync_int -o V
          ./obj_sync_int/V
          verilator --binary --timing -j 4 -Wno-fatal -Wno-TIMESCALEMOD -GSYNC_MEM=1 \
            $C tb/tb_rand.sv --top-module tb_rand -Mdir obj_sync_rand -o V
          for s in 1 7 42; do ./obj_sync_rand/V +seed=$s +n_prog=100; done

      - name: Yosys elaboration check
        run: |
          mkdir -p sim
          sv2v rtl/oh1_pkg.sv rtl/oh1_decode.sv rtl/oh1_core.sv > sim/oh1_core.v
          yosys -p 'read_verilog sim/oh1_core.v; hierarchy -check -top oh1_core; proc; check -assert'
          sv2v rtl/oh1_axi_lite.sv > sim/oh1_axi_lite.v
          yosys -p 'read_verilog sim/oh1_axi_lite.v; hierarchy -check -top oh1_axi_lite; proc; check -assert'
